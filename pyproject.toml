[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zwip"
version = "0.1.0"
description = "A local-first AI agent for authorised digital-footprint removal workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zwip contributors" }]
dependencies = ["playwright>=1.50,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
zwip = "zwip.cli:main"
zwip-inspect-google-form = "zwip.google_inspect:main"
zwip-google-dry-run = "zwip.sources.google:main"
zwip-capture-google-fixtures = "zwip.sources.google_capture:main"
zwip-google-report = "zwip.sources.google_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zwip.fixtures" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
