[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docubye"
version = "0.1.0"
description = "A local-first AI agent for authorised digital-footprint removal workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DocuBye contributors" }]
dependencies = ["playwright>=1.50,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ai = ["openai>=1.70"]

[project.scripts]
docubye = "docubye.cli:main"
docubye-inspect-google-form = "docubye.google_inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
