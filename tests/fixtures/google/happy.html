<!doctype html>
<!-- Sanitized synthetic model of the single-page Google removal wizard (SPA),
     hand-written from the structure validated 2026-11-15 against an owner-saved
     capture. Sections expand in place as radios are selected; there are no
     per-step URLs. Contains no real markup, assets, or personal data. -->
<html lang="en"><head><meta charset="utf-8"><title>Remove personal information (synthetic fixture)</title></head>
<body>
<main>
  <h1>Request to remove your personal information from Google Search (synthetic fixture)</h1>
  <form id="removal-wizard" action="/websearch/contact/content_removal_form" method="post">
    <fieldset id="section-reason">
      <legend>Why are you requesting removal?</legend>
      <label><input type="radio" name="reason" value="nudity">Content contains nudity or sexual material</label>
      <label><input type="radio" name="reason" value="personal">Content contains your personal information</label>
      <label><input type="radio" name="reason" value="exploitative">Content is on a site with exploitative removal practices</label>
      <label><input type="radio" name="reason" value="minor">Content shows a person under 18</label>
      <label for="country">Country of residence</label>
      <select id="country" name="country" required><option>United States</option></select>
    </fieldset>
    <fieldset id="section-info-type" hidden>
      <legend>What kind of personal information does the content contain?</legend>
      <label><input type="radio" name="info_type" value="contact">Address, phone number, and/or e-mail address</label>
      <label><input type="radio" name="info_type" value="bank">Bank account number</label>
      <label><input type="radio" name="info_type" value="credit">Credit card number</label>
      <label><input type="radio" name="info_type" value="govid">Government-issued ID document images</label>
      <label><input type="radio" name="info_type" value="records">Official records</label>
      <label><input type="radio" name="info_type" value="credentials">Login credentials</label>
      <label><input type="radio" name="info_type" value="other">Other personal information</label>
    </fieldset>
    <fieldset id="section-govid" hidden>
      <legend>Government-issued ID details</legend>
      <label><input type="radio" name="id_type" value="drivers">Driver's license</label>
      <label><input type="radio" name="id_type" value="passport">Passport</label>
      <label><input type="radio" name="id_type" value="national">National ID</label>
      <label><input type="radio" name="id_type" value="other-id">Other</label>
      <label for="id-last-four">Last four characters of the ID</label>
      <input id="id-last-four" name="id_last_four" type="text" maxlength="4">
      <label for="id-country">Issuing country</label>
      <select id="id-country" name="id_country"><option>United States</option></select>
    </fieldset>
    <fieldset id="section-details" hidden>
      <p>Is the content being shared with malicious, threatening, or harassing intent?</p>
      <label><input type="radio" name="doxxing_intent" value="yes">Yes</label>
      <label><input type="radio" name="doxxing_intent" value="no">No</label>
      <label for="contact-email">Contact email address</label>
      <input id="contact-email" name="contact_email" type="email" required>
      <label for="content-urls">Specific content URLs</label>
      <textarea id="content-urls" name="content_urls" required></textarea>
      <label for="screenshots">Screenshots (optional)</label>
      <input id="screenshots" name="screenshots" type="file" multiple>
      <label for="results-urls">Google Search results page URLs</label>
      <textarea id="results-urls" name="search_results_urls"></textarea>
      <label for="search-terms">Search terms</label>
      <textarea id="search-terms" name="search_terms"></textarea>
      <label><input type="checkbox" name="attest_accuracy" required> I confirm that the information in this request is accurate.</label>
      <label><input type="checkbox" name="attest_authority" required> I confirm that I am the person concerned or am authorised to act for them.</label>
    </fieldset>
    <div class="g-recaptcha" data-sitekey="synthetic-fixture" style="display:none"></div>
    <button type="button">Next</button>
    <button type="submit">Submit</button>
  </form>
</main>
<script>
  document.querySelectorAll('input[name="reason"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      document.getElementById('section-info-type').hidden = radio.value !== 'personal';
    });
  });
  document.querySelectorAll('input[name="info_type"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      document.getElementById('section-govid').hidden = radio.value !== 'govid';
      document.getElementById('section-details').hidden = false;
    });
  });
  document.getElementById('removal-wizard').addEventListener('submit', function () {
    window.__submitActivated = true;
  });
</script>
</body></html>
